name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  test:
    name: Build firmware and run unit tests
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run C++ firmware unit tests and compile check
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itest/mock -Iinclude \
            test/test_firmware.cpp src/PIDController.cpp src/GCConfig.cpp src/AnalogIO.cpp src/SerialComm.cpp \
            -o /tmp/test_firmware
          /tmp/test_firmware
          g++ -std=c++17 -Wall -Wextra -Werror -Itest/mock -Iinclude -c src/main.cpp -o /tmp/main.o

      - name: Install Python dependencies and PlatformIO
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -r desktop/requirements.txt platformio

      - name: Run Python CLI unit tests
        run: |
          /tmp/venv/bin/python -m py_compile desktop/openms_controller.py test/test_desktop.py
          /tmp/venv/bin/python -m unittest discover -s test -v

      - name: Build AVR Mega 2560 firmware with PlatformIO
        run: |
          /tmp/venv/bin/pio run
